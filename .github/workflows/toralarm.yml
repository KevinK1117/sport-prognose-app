
name: SportRadar Toralarm
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sportradar-toralarm
  cancel-in-progress: false
jobs:
  check-goals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python toralarm.py
        env:
          API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          
      - name: Test ntfy push
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python - <<'PY'
          import os
          import requests

          topic = os.environ["NTFY_TOPIC"]
          response = requests.post(
              f"https://ntfy.sh/{topic}",
              data="SportRadar Toralarm funktioniert!".encode("utf-8"),
              headers={"Title": "SportRadar Test", "Tags": "tada"},
              timeout=15,
          )
          response.raise_for_status()
          print("Testnachricht erfolgreich an ntfy übermittelt.")
          PY

      - name: Persist processed goals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f data/toralarm_state.json ]; then
            git add data/toralarm_state.json
            if ! git diff --cached --quiet; then
              git commit -m "Update toralarm state"
              git push
            fi
          else
            echo "Noch keine Tore verarbeitet – keine Statusdatei vorhanden."
          fi
